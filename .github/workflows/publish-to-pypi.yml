name: Publish to PyPI

on:
  # Recovery rebuilds the existing immutable tag with compatible upload tooling.
  workflow_dispatch:
  push:
    tags:
      - v0.1.1

jobs:
  build:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/tags/v0.1.1') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/v0.1.1
          persist-credentials: false
      - name: Verify immutable release source
        run: test "$(git rev-parse HEAD)" = 704ffaa019ea21c923afb20d809d7ef08adf756d
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Sync locked test environment
        run: uv sync --frozen --extra dev
      - name: Test tag checkout
        run: uv run python -m pytest -m "not live_model_backend"
      - name: Build distributions
        run: uv build
      - name: Smoke installed distributions
        run: uv run python scripts/ci_package_smoke.py dist
      - name: Verify reviewed distributions
        shell: bash
        run: |
          expected=(
            "millforge-0.1.1-py3-none-any.whl"
            "millforge-0.1.1.tar.gz"
          )
          mapfile -t actual < <(
            find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
              -printf '%f\n' | sort
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected distribution set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          cat > dist/SHA256SUMS <<'EOF'
          54f9be66cc703a9253b19c0b0439ca08d1802fd2bd1f7af926b041d8b0f663e3  millforge-0.1.1-py3-none-any.whl
          8507a43a26e1dcda2e2bc0763362441f0d37325b876de28a85d60ff64da98c22  millforge-0.1.1.tar.gz
          EOF
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Upload reviewed distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millforge-0.1.1-py3-none-any.whl
            dist/millforge-0.1.1.tar.gz
            dist/SHA256SUMS

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/tags/v0.1.1') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - name: Recheck reviewed distributions
        shell: bash
        run: |
          expected=(
            "SHA256SUMS"
            "millforge-0.1.1-py3-none-any.whl"
            "millforge-0.1.1.tar.gz"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected downloaded file set: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          cat > expected-SHA256SUMS <<'EOF'
          54f9be66cc703a9253b19c0b0439ca08d1802fd2bd1f7af926b041d8b0f663e3  millforge-0.1.1-py3-none-any.whl
          8507a43a26e1dcda2e2bc0763362441f0d37325b876de28a85d60ff64da98c22  millforge-0.1.1.tar.gz
          EOF
          cmp --silent expected-SHA256SUMS dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          rm expected-SHA256SUMS
          rm dist/SHA256SUMS
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
